name: FSD Project CI & Docker Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run automated unit tests
        run: python -m unittest discover -v

      - name: Build Docker image
        run: docker build -t smart-job-portal .

      - name: Test Docker container health & metrics
        run: |
          docker run -d --name app-test -p 3000:3000 smart-job-portal
          sleep 6
          docker logs app-test
          curl -s http://127.0.0.1:3000/health || exit 1
          curl -s http://127.0.0.1:3000/metrics || exit 1
          docker stop app-test
          docker rm app-test

      - name: Tag and Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag smart-job-portal ghcr.io/${REPO_LOWER}:${{ github.sha }}
          docker tag smart-job-portal ghcr.io/${REPO_LOWER}:latest
          docker push ghcr.io/${REPO_LOWER}:${{ github.sha }} || true
          docker push ghcr.io/${REPO_LOWER}:latest || true
